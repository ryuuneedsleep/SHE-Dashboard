<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <!-- Background with Toyota-inspired corporate red and rounded corners -->
  <rect width="512" height="512" rx="100" fill="#EB0A1E"/>
  
  <!-- Subtle inner gradient sheen -->
  <rect width="512" height="512" rx="100" fill="url(#pwa-sheen-512)" opacity="0.15"/>
  
  <!-- Safety Shield Icon -->
  <g transform="translate(128, 86)">
    <!-- Shield Outline / Body -->
    <path d="M128 16L36 48V128C36 198 76 260 128 284C180 260 220 198 220 128V48L128 16Z" fill="#FFFFFF"/>
    <!-- Safety Cross Accent Inside Shield -->
    <path d="M128 64V216" stroke="#EB0A1E" stroke-width="22" stroke-linecap="round"/>
    <path d="M74 124H182" stroke="#EB0A1E" stroke-width="22" stroke-linecap="round"/>
  </g>
  
  <!-- Typography Banner -->
  <text x="256" y="416" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" letter-spacing="6">SPLD</text>
  <text x="256" y="462" text-anchor="middle" fill="#FFFFFF" opacity="0.9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="28" letter-spacing="8">SAFETY</text>
  
  <defs>
    <linearGradient id="pwa-sheen-512" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>

